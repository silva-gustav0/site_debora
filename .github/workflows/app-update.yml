# Publica a atualização do app Android pela internet (EAS Update) quando o app ou as regras compartilhadas mudam.
# Só chega aos APKs compatíveis (fingerprint); mudança nativa exige um APK novo (eas build).
name: Atualizar app Android

on:
  push:
    branches: [master]
    paths: ["mobile/**", "src/lib/**"]
  workflow_dispatch:

concurrency:
  group: app-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas update --platform android --channel preview --message "${COMMIT_MSG:-Atualização manual}" --non-interactive
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_POWERSYNC_URL: https://6abb2c938453e7cf833af506.powersync.journeyapps.com
          EXPO_PUBLIC_SITE_URL: https://deborasilvaestetica.com.br
